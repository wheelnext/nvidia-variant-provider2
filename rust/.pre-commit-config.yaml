---
# Run with the workspace's locked tools: uv run prek run --all-files
default_language_version:
  python: python3.14

# ========================================================================= #
#                                 FORMATING                                 #
# ========================================================================= #

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: detect-private-key

  # Markdown formatting
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.5
    hooks:
      - id: prettier
        name: prettier markdown
        types_or: [markdown]
        args: [--prose-wrap=always]

  # ========================================================================= #
  #                                    RUST                                   #
  # ========================================================================= #

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --locked --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

  # -------------------------
  # Security/License Check
  # -------------------------
  - repo: https://github.com/EmbarkStudios/cargo-deny
    rev: 0.20.2
    hooks:
      - id: cargo-deny
        args: [--all-features, check]
        always_run: true

  - repo: local
    hooks:
      - id: cargo-audit
        name: Check Rust dependencies for vulnerabilities
        entry: cargo audit
        language: rust
        additional_dependencies: ["cli:cargo-audit:0.22.2"]
        files: Cargo\.lock
        pass_filenames: false

  # -------------------------
  # Unused Dependency Check
  # -------------------------
  - repo: https://github.com/bnjbvr/cargo-machete
    rev: v0.9.2  # Replace with a specific tag/version if preferred
    hooks:
      - id: cargo-machete
        args: [--with-metadata]
