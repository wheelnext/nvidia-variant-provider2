[package]
name = "variant-provider"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Independent interpreter for JSON-defined variant providers"
include = ["src/**", "build.rs", "Cargo.toml", "Cargo.lock", "data/**", "README.md", "LICENSE"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.33", default-features = false }
libloading = "0.8"
libffi = "5.1"
pep440_rs = "0.7"
ed25519-dalek = "2"
base64 = "0.22"
sha2 = "0.10"

[build-dependencies]
sha2 = "0.10"

[[bin]]
name = "variant-provider-rs"
path = "src/main.rs"
