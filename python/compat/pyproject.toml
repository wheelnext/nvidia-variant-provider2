[build-system]
requires = ["flit_core>=3.11,<5"]
build-backend = "flit_core.buildapi"
[project]
name = "nvidia-variant-provider"
version = "0.1.0"
description = "Compatibility facade for the JSON-defined NVIDIA variant provider"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["variant-provider==0.1.0"]
[project.entry-points.variant_plugins]
nvidia_variant_provider = "nvidia_variant_provider.plugin:NvidiaVariantPlugin"
