[build-system]
requires = ["flit_core>=3.11,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "variant-provider"
version = "0.1.0"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Independent declarative variant provider interpreter"
requires-python = ">=3.10"
dependencies = ["packaging>=24", "jsonschema>=4.23", "cryptography>=44"]

[project.optional-dependencies]
test = ["pytest>=8", "build>=1.2"]

[project.scripts]
variant-provider-py = "variant_provider.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
